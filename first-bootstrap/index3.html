<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- ...................................... Bootstrap icon link.............................................................. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body{
      background: linear-gradient(to right, RED, navy);
    }

    .btn-custom {
      background: linear-gradient(to right, RED, navy);
    }
  </style>
</head>
<body>


<!--...........................................outerrrrrrrrrrrrrrr............................................ -->
<body class=" bg-primary d-flex align-items-center justify-content-center">

<div class="container mt-5">
  <div class="row justify-content-center gap-4 d-flex  align-items-end mt-5">

    <!-- ....................................................Login ...............inner1........................................-->
    <div class="col-4 mt-5">
      <div class="card p-4 shadow">
        <h3 class="mb-3">Login</h3>
        <div class="d-flex align-items-start justify-content-center border-bottom border-dark pb-2">
            <i class="bi bi-envelope fs-5"></i>
            <input type="email" class="form-control border-0" placeholder="Enter your email">
        </div>

        <div class="d-flex align-items-start justify-content-center border-bottom border-dark pb-2">
            <i class="bi bi-lock fs-5"></i>
            <input type="password" class="form-control border-0" placeholder="Confirm your password">
            <!-- .........EYE.......... -->
             <i class="bi bi-eye fs-5"></i>
        </div>
        
        <div class="d-flex justify-content-between mb-3">
          <div>
            <input type="checkbox"> Remember me
          </div>
          <a href="#">Forget password?</a>
        </div>

        <button class="btn btn-custom w-100 mb-3 bg-primary text-light">Login now</button>

        <p class="text-center">
          Don't have an account? <a href="#">Signup now</a>
        </p>
      </div>
    </div>

    <!-- ........................................................Registration................inner2............................. -->
    <div class="col-4 mt-5">
      <div class="card p-4 shadow">
        <h3 class="mb-3">Registration</h3>

        <div class="d-flex align-items-start justify-content-center border-bottom border-dark pb-2">
            <i class="bi bi-person fs-5"></i>
            <input type="text" class="form-control border-0" placeholder="Enter your name">
        </div>

        <div class="d-flex align-items-start justify-content-center border-bottom border-dark pb-2">
            <i class="bi bi-envelope fs-5"></i>
            <input type="email" class="form-control border-0" placeholder="Enter your email">
        </div>
        
        <div class="d-flex align-items-start justify-content-center border-bottom border-dark pb-2">
            <i class="bi bi-lock fs-5"></i>
            <input type="password" class="form-control border-0" placeholder="Create your password">
        </div>
        
        <div class="d-flex align-items-start justify-content-center border-bottom border-dark pb-2">
            <i class="bi bi-lock fs-5"></i>
            <input type="password" class="form-control border-0" placeholder="Confirm password">
            <!-- .....EYE..............-->
            <i class="bi bi-eye fs-5"></i>
            
        </div>
    
        <br>
        
        <div class="mb-3">
          <input type="checkbox"> I accept all terms & conditions
        </div>

        <button class="btn btn-custom w-100 mb-3 bg-primary text-light">Register now</button>

        <p class="text-center">
          Already have an account? <a href="#">Login now</a>
          </p>
      </div>
    </div>

  </div>
</div>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</body>
</html>
