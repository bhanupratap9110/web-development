<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body>
    <body class=" container">
     
    <header class="bg-primary p-3 d-flex justify-content-center text-white mb-4">
        <h3>Coching Registraction Form</h3>
    </header>

    <div class="container d-flex justify-content-center align-items-center gap-5 border-bottom border-dark pb-2 ">
        <input type="text" name="FullName" id="FullName" class="form-control border-0" placeholder="Enter your FullName">          
    </div>
    <span class="text-danger d-flex justify-content-end">
        Please Enter Your FullName
    </span>

    <div class="container d-flex justify-content-center align-items-center gap-5"></div>
        <input type="text" name="email" id="email" class="form-control" placeholder="Enter your Email Address">
    </div>
    <span class="text-danger d-flex justify-content-end mb-3">
        please Enter Your Email Address
    </span>

    
    <div class="container d-flex justify-content-center align-items-center gap-5 border-bottom border-dark pb-2 ">
        <input type="text" name="MobileNumber" id="MobileNumber" class="form-control border-0" placeholder="Enter your MobileNumber">  
    </div>
    <span class="text-danger d-flex justify-content-end mb-3">
        please Enter Your MobileNumber
    </span>

     <div class="container d-flex justify-content-center align-items-center gap-5 border-bottom border-dark pb-2 ">
        <input type="text" name="DOB:" id="DOB:" class="form-control border-0" placeholder="Enter your Date of Barth">
    </div>
    <span class="text-danger d-flex justify-content-end mb-3">
        please Enter Your Date of Birth
    </span>

    <div class="container  gap-5">
        <input type="text" name="Qualification" id="Qualification" placeholder="Enter your Qualification" class="form-control">
    </div>
    <span class="text-danger d-flex justify-content-end mb-3">
        please Enter Your Qualification
    </span>

    <div class="container  gap-5">
        <input type="text" name="Grade" id="Grade" class="form-control" placeholder="Percentage/Grade in Last Qualification: ">
    </div>
    <span class="text-danger d-flex justify-content-end mb-3">
        please Enter Your Qualification Percentage/Grade
    </span>
    <!-- JS -->
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</body>
</html>
